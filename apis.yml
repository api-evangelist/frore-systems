name: Frore Systems
description: >-
  Frore Systems is a Silicon Valley thermal-management company that develops solid-state active
  cooling technology for high-performance computing in space-constrained devices. Its flagship
  AirJet solid-state cooling chips (AirJet Mini and AirJet PAK families) and LiquidJet direct-to-chip
  liquid cooling for data centers enable higher power density, quieter operation, and thinner designs
  across consumer devices, mini PCs, industrial embedded systems, and data-center compute trays. The
  company partners with Intel, Qualcomm, NVIDIA, AMD, Phison, and Zotac, is headquartered in Silicon
  Valley with manufacturing in Taiwan, and reached unicorn status following a Series D round. Frore is
  a hardware/semiconductor company with no public developer API surface; this profile is maintained in
  the API Evangelist network for company identity and market coverage.
